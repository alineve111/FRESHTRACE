<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshTrace – Get to know your salad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="home" class="screen hero">
    <div class="hero-text">
      <p class="brand">FreshTrace</p>
      <h1>Get to know<br>your salad, from<br>farm to cup.</h1>
      <p class="lead">Scan the QR code on the pack or pick a salad to see its ingredients, farmers, and freshness.</p>
      <button class="btn" data-go="pick">Pick a salad</button>
    </div>
    <svg class="hero-art" viewBox="0 0 520 460" role="img" aria-label="Illustration of a colorful salad bowl">
      <circle cx="260" cy="235" r="205" fill="#fff" opacity=".4"/>
      <circle cx="92" cy="118" r="46" fill="#ff8a1f"/><circle cx="92" cy="118" r="37" fill="#ffb347"/>
      <path d="M92 81v74M55 118h74M66 92l52 52M118 92l-52 52" stroke="#fff" stroke-width="3" opacity=".8"/>
      <path d="M440 78c32 0 46 21 37 46-8 24-27 38-37 44-10-6-29-20-37-44-9-25 5-46 37-46z" fill="#ff3d5a"/>
      <path d="M423 78l17-14 17 14-17 7z" fill="#2fa84f"/>
      <g fill="#ffd1d8"><circle cx="428" cy="108" r="3"/><circle cx="450" cy="106" r="3"/><circle cx="439" cy="128" r="3"/></g>
      <ellipse cx="190" cy="215" rx="72" ry="34" transform="rotate(-25 190 215)" fill="#5cc45a"/>
      <ellipse cx="338" cy="205" rx="74" ry="34" transform="rotate(28 338 205)" fill="#2fa84f"/>
      <ellipse cx="262" cy="178" rx="64" ry="38" fill="#86d86a"/>
      <rect x="352" y="206" width="84" height="22" rx="11" transform="rotate(-35 394 217)" fill="#ff8a1f"/>
      <rect x="95" y="214" width="78" height="22" rx="11" transform="rotate(30 134 225)" fill="#ff8a1f"/>
      <circle cx="226" cy="236" r="38" fill="#8e3fb0"/><path d="M198 236q28-32 56 0" stroke="#c88be4" stroke-width="5" fill="none"/>
      <circle cx="318" cy="240" r="34" fill="#ff4b3e"/><circle cx="306" cy="228" r="7" fill="#fff" opacity=".55"/>
      <circle cx="160" cy="252" r="26" fill="#ff4b3e"/>
      <circle cx="268" cy="226" r="30" fill="#c6e98a" stroke="#2fa84f" stroke-width="7"/><g fill="#2fa84f"><circle cx="262" cy="222" r="2.5"/><circle cx="274" cy="224" r="2.5"/><circle cx="268" cy="234" r="2.5"/></g>
      <path d="M80 252h360c0 100-70 170-180 170S80 352 80 252z" fill="#1f8a4c"/>
      <rect x="68" y="240" width="384" height="24" rx="12" fill="#17402b"/>
      <path d="M122 296q10 58 68 84" stroke="#fff" stroke-opacity=".35" stroke-width="10" fill="none" stroke-linecap="round"/>
    </svg>
  </section>

  <section id="pick" class="screen wrap" hidden>
    <button class="back" data-go="home">← Back</button>
    <h2>Pick a salad</h2>
    <div id="pick-list"></div>
  </section>

  <section id="salad" class="screen wrap" hidden>
    <button class="back" data-go="pick">← All salads</button>
    <div class="detail">
      <div class="photo"><img id="s-img" alt=""></div>
      <div class="info">
        <p class="chip" id="s-type"></p>
        <h2 id="s-name"></h2>
        <p id="s-goal" class="lead"></p>

        <h3>Ingredients</h3>
        <p class="hint">Tap an ingredient to see where it comes from and its journey.</p>
        <div id="s-ing" class="ing-grid"></div>
        <p class="meta"><b>Saus:</b> <span id="s-sauce"></span></p>
        <p class="meta"><b>Catatan:</b> <span id="s-note"></span></p>

        <h3>Freshness</h3>
        <div class="fresh">
          <div class="fresh-top"><span class="dot" id="f-dot"></span><strong id="f-status"></strong><span id="f-pct"></span></div>
          <div class="bar"><i id="f-bar"></i></div>
        </div>

        <h3>Product passport</h3>
        <dl class="passport" id="s-pass"></dl>
      </div>
    </div>
  </section>
</main>

<dialog id="dlg"><button class="x" aria-label="Close">✕</button><div id="dlg-body"></div></dialog>
<script src="script.js"></script>
</body>
</html>
